name: Tests

on:
  push:
    branches: [main]
    paths: ["analyze.py", "tests/**", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run offline tests (standard library only)
        run: python -m unittest discover -s tests -v
